# Site settings
title: Markos Fragkakis
description: Software Engineer
url: "https://fragkakis.org"
baseurl: ""

# Theme
theme: minima

# Author
author:
  name: Markos Fragkakis
  email: ""

# Social links (displayed in footer)
minima:
  social_links:
    - { platform: github, user_url: "https://github.com/fragkakis" }
    - { platform: twitter, user_url: "https://twitter.com/fragkakis" }
    - { platform: linkedin, user_url: "https://linkedin.com/in/fragkakis" }

# Header navigation pages
header_pages:
  - about.md
  - blog.md
  - projects.md

# Google Analytics
google_analytics: UA-75124530-1

# Permalink structure
permalink: /:title/

# Markdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Plugins
plugins:
  - jekyll-feed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
